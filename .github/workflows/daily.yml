name: Daily market research

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC = 08:00 Africa/Cairo during UTC+2; DST changes must be reviewed.
    - cron: "0 6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: daily-market-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run safe placeholder
        run: python -m egx_intelligence.cli --mode daily
